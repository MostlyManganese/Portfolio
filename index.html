<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PickledMango's Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at 20% 20%, #0b1222, #04070f 55%);
      font-family: 'Space Mono', 'SFMono-Regular', Menlo, Consolas, monospace;
      color: #e2e8f0;
      overflow: hidden;
    }
    #root {
      position: fixed;
      inset: 0;
    }
    #crt-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #start {
      position:fixed;
      inset:0;
      z-index:10;
      display:grid;
      place-items:center;
      color:#94a3b8;
      font:48px 'Press Start 2P',monospace;
      cursor:pointer;
      animation:blink 1.2s steps(2) infinite}
      @keyframes blink{50%{opacity:.3}}
      @media (prefers-reduced-motion:reduce){#start{animation:none}}
    }
  </style>
</head>
<body>
  <div id="start">Click or press any key to power on</div>
  <div id="root">
    <canvas id="crt-canvas"></canvas>
  </div>
  <script type="module" src="./crt-webgl.js"></script>
</body>
</html>
